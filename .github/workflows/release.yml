name: Release
run-name: Release ${{ inputs.module || github.event.pull_request.head.ref }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: Module to release
        required: true
        options: [sdk-js, agent-js, sdk-rust, agent-rust, sdk-go, agent-go]
      version:
        description: Version to release (e.g., 1.2.3)
        required: true
      publish_commit:
        description: Retry publishing a merged release (full commit SHA)
        required: false
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.module || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_commit == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODULE: ${{ inputs.module }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release request
        id: release
        run: node scripts/release.ts info
      - name: Find existing release PR
        id: pr
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [[ -n "$url" ]]; then echo "$url" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.pr.outputs.url == '' && endsWith(inputs.module, '-rust')
        with:
          toolchain: stable
      - uses: actions/setup-go@v6
        if: steps.pr.outputs.url == '' && endsWith(inputs.module, '-go')
        with:
          go-version: 1.25.x
          cache: false
      - name: Prepare versions and SDK dependencies
        if: steps.pr.outputs.url == ''
        run: node scripts/release.ts prepare
      - name: Update npm lockfile
        if: steps.pr.outputs.url == '' && endsWith(inputs.module, '-js')
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Update Cargo lockfile
        if: steps.pr.outputs.url == '' && endsWith(inputs.module, '-rust')
        run: cargo update --workspace
      - name: Update Go checksums
        if: steps.pr.outputs.url == '' && inputs.module == 'agent-go'
        env:
          GOWORK: "off"
        run: go -C agent-go mod tidy
      - name: Open release PR
        if: steps.pr.outputs.url == ''
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git diff --check
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/releases "$RELEASE_MODULE"
          for file in package-lock.json Cargo.lock go.work.sum; do
            if [[ -f "$file" ]]; then git add "$file"; fi
          done
          git commit -m "release: $TAG"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "Release $TAG" --body '' >> "$GITHUB_STEP_SUMMARY"

  verify:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_commit != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      module: ${{ steps.release.outputs.module }}
      version: ${{ steps.release.outputs.version }}
      registry: ${{ steps.release.outputs.registry }}
      package: ${{ steps.release.outputs.package }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify merged release PR and versions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODULE: ${{ inputs.module }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.publish_commit }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            node scripts/release.ts retry
          else
            node scripts/release.ts merged
          fi

  publish-npm:
    needs: verify
    if: needs.verify.outputs.ready == 'true' && needs.verify.outputs.registry == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        env:
          PACKAGE: ${{ needs.verify.outputs.package }}
          VERSION: ${{ needs.verify.outputs.version }}
          MODULE: ${{ needs.verify.outputs.module }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          status=$(curl --silent --show-error --output /tmp/npm-version.json --write-out '%{http_code}' "https://registry.npmjs.org/$PACKAGE/$VERSION")
          case "$status" in
            200)
              if [[ $(jq -r '.gitHead // empty' /tmp/npm-version.json) != "$RELEASE_COMMIT" ]]; then
                echo "$PACKAGE@$VERSION was published from another commit" >&2
                exit 1
              fi
              echo "$PACKAGE@$VERSION is already published from this commit"
              ;;
            404) npm publish --workspace="$MODULE" ;;
            *) echo "npm registry check failed: HTTP $status" >&2; exit 1 ;;
          esac

  publish-crates:
    needs: verify
    if: needs.verify.outputs.ready == 'true' && needs.verify.outputs.registry == 'crates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ needs.verify.outputs.package }}
          VERSION: ${{ needs.verify.outputs.version }}
          MODULE: ${{ needs.verify.outputs.module }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          CRATES_USER_AGENT: llm-sdk releases (https://github.com/${{ github.repository }})
        run: |
          status=$(curl --silent --show-error --user-agent "$CRATES_USER_AGENT" --output /tmp/crate-version.json --write-out '%{http_code}' "https://crates.io/api/v1/crates/$PACKAGE/$VERSION")
          case "$status" in
            200)
              curl --fail --location --silent --show-error --user-agent "$CRATES_USER_AGENT" --output /tmp/published.crate "https://crates.io/api/v1/crates/$PACKAGE/$VERSION/download"
              published_commit=$(tar -xOf /tmp/published.crate "$PACKAGE-$VERSION/.cargo_vcs_info.json" | jq -r '.git.sha1')
              if [[ "$published_commit" != "$RELEASE_COMMIT" ]]; then
                echo "$PACKAGE@$VERSION was published from another commit" >&2
                exit 1
              fi
              echo "$PACKAGE@$VERSION is already published from this commit"
              ;;
            404) cargo publish --locked --manifest-path "$MODULE/Cargo.toml" ;;
            *) echo "crates.io registry check failed: HTTP $status" >&2; exit 1 ;;
          esac

  release:
    needs: [verify, publish-npm, publish-crates]
    if: |
      !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.ready == 'true' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ needs.verify.outputs.module }}
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release"
            exit 0
          fi
          previous=$(git tag --list "$MODULE/v*" --sort=-version:refname | { grep -Fvx "$TAG" || true; } | head -n 1)
          args=(--repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --generate-notes)
          if [[ -n "$previous" ]]; then args+=(--notes-start-tag "$previous"); fi
          gh release create "$TAG" "${args[@]}"
